<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rails49 | Not Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* The same two the landing page draws, and for the same reason: a
               person who lands here has not left the project. `look/README.md`
               says where they came from. */
            --band: #1d4ed8;
            --band-ink: #ffffff;

            --bg: #f8fafc;
            --accent: var(--band);
            --text-main: #0f172a;
            --text-muted: #475569;
            --font-display: 'Outfit', sans-serif;
            --font-sans: 'Inter', sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0d12;
                /* Lighter than the band, which would be unreadable here. The
                   band keeps its one value in both schemes. */
                --accent: #60a5fa;
                --text-main: #f3f4f6;
                --text-muted: #9ca3af;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* The band, as on the landing page: the site's name on its left, and
           nothing on its right. */
        .band {
            background-color: var(--band);
            color: var(--band-ink);
            display: flex;
            align-items: center;
            height: 60px;
            padding: 0 2rem;
        }

        .band-name {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--band-ink);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .band-name::before {
            content: "🚂";
            font-size: 1.3rem;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .code {
            font-family: var(--font-display);
            font-size: clamp(4rem, 18vw, 9rem);
            font-weight: 800;
            line-height: 1;
            color: var(--accent);
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(1.25rem, 4vw, 1.75rem);
            font-weight: 600;
            margin-top: 0.5rem;
        }

        p {
            color: var(--text-muted);
            margin-top: 1rem;
            max-width: 34rem;
            line-height: 1.6;
        }

        .links {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .links a:hover { border-bottom-color: var(--accent); }
    </style>
</head>
<body>
    <header class="band">
        <a class="band-name" href="/">Rails49</a>
    </header>

    <main>
        <div class="code">404</div>
        <h1>No such page</h1>
        <p>
            The occupancy app moved to its own address and no longer lives under
            <code>rails49.org/ui/</code>.
        </p>
        <div class="links">
            <a href="/">Back to rails49.org</a>
            <a href="https://occupancy.rails49.org/">Launch Occupancy UI</a>
            <a href="https://github.com/rails49/occupancy">Source on GitHub</a>
        </div>
    </main>
</body>
</html>
