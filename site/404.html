<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rails49 | Not Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0d12;
            --primary: #0df2c9;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-display: 'Outfit', sans-serif;
            --font-sans: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .code {
            font-family: var(--font-display);
            font-size: clamp(4rem, 18vw, 9rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #fff 40%, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(1.25rem, 4vw, 1.75rem);
            font-weight: 600;
            margin-top: 0.5rem;
        }

        p {
            color: var(--text-muted);
            margin-top: 1rem;
            max-width: 34rem;
            line-height: 1.6;
        }

        .links {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        a:hover { border-bottom-color: var(--primary); }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>No such page</h1>
        <p>
            The occupancy app moved to its own address and no longer lives under
            <code>rails49.org/ui/</code>.
        </p>
        <div class="links">
            <a href="/">Back to rails49.org</a>
            <a href="https://occupancy.rails49.org/">Launch Occupancy UI</a>
            <a href="https://github.com/rails49/occupancy">Source on GitHub</a>
        </div>
    </main>
</body>
</html>
